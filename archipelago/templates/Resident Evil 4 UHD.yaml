name: Leon
description: Resident Evil 4 UHD
game: Resident Evil 4 UHD

Resident Evil 4 UHD:
  # Shuffle key items (Insignia Key, False Eye, Card Keys...) into the multiworld.
  # false keeps every key item where it is in the vanilla game.
  shuffle_key_items: true

  # Ammo, herbs, grenades and sprays placed in the world are checks (~450). Enemy drops don't count.
  consumable_checks: true

  # How many placed pesetas pickups per stage (village, castle, island) are checks: 0-50. You keep the money.
  # Enemy drops don't count. Filler-only.
  pesetas_checks: 25

  # First purchase of each Merchant item is a check.
  merchant_checks: true

  # check_only: buying only sends the check; the item goes to the multiworld (you get it from Archipelago).
  # keep_item: you also keep what you bought.
  merchant_purchases: check_only

  # Extra filler-only checks per stage (0-15) for treasures nothing else counts, like random enemy drops.
  bonus_treasure_checks: 5

  # Defeating Del Lago, the El Gigantes, Mendez, Verdugo, Salazar, U-3 and Krauser are checks.
  boss_checks: true

  # Each of the 24 bottle caps from the shooting gallery is a check.
  shooting_gallery_checks: true

  # Extra weapon at the start (with 2 boxes of its ammo): vanilla, random_handgun, random_weapon
  starting_weapon: vanilla

  # Random supplies (ammo, herbs, grenades, sprays) at the start: 0-10
  starting_supplies: 0

  # Pesetas at the start: 0-100000
  starting_pesetas: 0

  # Built in, nothing to download: every enemy spawns with random health.
  # off, mild (75-150%), tough (100-200%), wild (50-250%), chaos (25-400%)
  random_enemy_health: off

  # --- re_duke's RE4 PC Randomizer (install it yourself inside the game folder; see the tutorial) ---
  # Random enemies / enemy health / Merchant / loadout from re_duke's randomizer, set up by the client's /setup.
  # Doors and item randomization stay off there (Archipelago places the items).
  # Random enemies turn off boss checks; random Merchant turns off Merchant checks and the medallion reward.
  # For random enemies only: re_duke_randomizer: true, re_duke_merchant: false
  re_duke_randomizer: false
  re_duke_preset: default        # default, normal, hard
  re_duke_enemies: true
  re_duke_enemy_health: true
  re_duke_merchant: true
  re_duke_starting_loadout: false

  # When you die, everyone with DeathLink dies, and vice versa. Experimental.
  death_link: false

  progression_balancing: 50
  accessibility: full
