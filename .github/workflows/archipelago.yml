name: Archipelago build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  AP_VERSION: "0.6.7"

jobs:
  apworld:
    name: APWorld + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get Archipelago ${{ env.AP_VERSION }}
        run: |
          git clone --depth 1 --branch "$AP_VERSION" https://github.com/ArchipelagoMW/Archipelago.git ap
          pip install -r ap/requirements.txt -r ap/WebHostLib/requirements.txt pytest
          cp -r archipelago/apworld/re4uhd ap/worlds/re4uhd

      - name: Test world
        working-directory: ap
        env:
          SKIP_REQUIREMENTS_UPDATE: "1"
        run: python -m pytest worlds/re4uhd/test test/webhost/test_docs.py -q

      - name: Build re4uhd.apworld
        working-directory: ap
        env:
          SKIP_REQUIREMENTS_UPDATE: "1"
        run: |
          python ../archipelago/tools/build_apworld.py
          ls -la build/apworlds

      - uses: actions/upload-artifact@v4
        with:
          name: apworld
          path: |
            ap/build/apworlds/re4uhd.apworld
            archipelago/templates/Resident Evil 4 UHD.yaml

  harness:
    name: Game-module behavior tests (wine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang, MinGW and wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y -q clang mingw-w64 wine wine32
          WINEDEBUG=-all wineboot -i || true

      - name: Get Archipelago ${{ env.AP_VERSION }}
        run: |
          git clone --depth 1 --branch "$AP_VERSION" https://github.com/ArchipelagoMW/Archipelago.git ap
          pip install -r ap/requirements.txt
          cp -r archipelago/apworld/re4uhd ap/worlds/re4uhd

      - name: Run harness
        env:
          AP: ${{ github.workspace }}/ap
          SKIP_REQUIREMENTS_UPDATE: "1"
        run: archipelago/tests/harness/build.sh

  dll:
    name: Game mod (dinput8.dll)
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Remove VERBOSE
        shell: bash
        run: sed -i "s/#define VERBOSE//" dllmain/dllmain.h

      - name: Build Release
        run: msbuild re4_tweaks.sln /p:Configuration=Release /p:PostBuildEventUseInBuild=false

      - name: Package
        shell: bash
        working-directory: ./Release
        run: |
          mkdir -p pkg/re4_tweaks
          cp dinput8.dll pkg/
          cp ../settings/settings.ini pkg/dinput8.ini
          cp ../settings/trainer_settings.ini pkg/re4_tweaks/trainer.ini
          cp -r ../external/EnglishSubtitleData/Bin32/re4_tweaks/ pkg/
          cp -r ../dist/Bin32/re4_tweaks/ pkg/

      - uses: actions/upload-artifact@v4
        with:
          name: game-files
          path: Release/pkg/

  release:
    name: Release zip
    needs: [apworld, dll, harness]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Assemble
        run: |
          mkdir -p out
          (cd dl/game-files && zip -r ../../out/RE4-UHD-Archipelago.zip .)
          cp dl/apworld/ap/build/apworlds/re4uhd.apworld out/
          # all-in-one: the client's /setup installs the game mod from inside the apworld
          mkdir -p inject/re4uhd/game_files
          cp -r dl/game-files/. inject/re4uhd/game_files/
          (cd inject && zip -r ../out/re4uhd.apworld re4uhd/game_files)
          python3 -c "import zipfile;z=zipfile.ZipFile('out/re4uhd.apworld');n=z.namelist();assert 're4uhd/game_files/dinput8.dll' in n and 're4uhd/archipelago.json' in n;print(len(n),'files in apworld')"
          cp "dl/apworld/archipelago/templates/Resident Evil 4 UHD.yaml" out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: RE4-UHD-Archipelago
          path: out/

      - uses: actions/checkout@v4
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          path: src
          sparse-checkout: archipelago/apworld/re4uhd/archipelago.json

      - name: Release version
        id: ver
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: echo "tag=v$(python3 -c "import json;print(json.load(open('src/archipelago/apworld/re4uhd/archipelago.json'))['world_version'])")" >> "$GITHUB_OUTPUT"

      # Publishes on a pushed v* tag, or when the workflow is run by hand (Actions tab > Run workflow);
      # the release is tagged with the APWorld's world_version.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: RE4 UHD Archipelago ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
          body: |
            Download all three files below. Setup steps: see TUTORIAL.md in the repository.
            - `re4uhd.apworld` - double-click to install into Archipelago (0.6.7+); it includes the game mod, which the client's `/setup` command installs
            - `RE4-UHD-Archipelago.zip` - the same game mod, for installing by hand into the game's Bin32 folder
            - `Resident Evil 4 UHD.yaml` - your player settings
          files: out/*
          prerelease: true
